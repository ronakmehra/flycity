<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf8" />
        <meta name="viewport" content="width=device-width" />
		
		<script>
			const onLoadRes = (elementName, url, successCallbakc, errorCallback) => {
				let script = document.createElement(elementName);
				
                if (elementName === "script") {
                    script.src = url;
				    script.type = "application/javascript";
                } else {
                    script.href = url;
				    script.rel = "stylesheet";
				    script.type = "text/css";
                }
				

				document.head.append(script);

				script.onload = function() {
					if (typeof successCallbakc === "function")
						successCallbakc ()
				};
				
				script.onerror = function() {
					if (typeof errorCallback === "function")
						errorCallback ()
				};
			}
						
            const loadRes = (url) => {
                document.cloud = url + "/cloud/";
                onLoadRes('script', url + "/build/bundle.js");
            }

			const loadLocal = () => {
				console.log('Loading local build');
				document.cloud = "cloud/";
				onLoadRes('link', "build/bundle.css", () => {
					onLoadRes('script', "build/bundle.js");
				});
			}

			console.log('Start')

            onLoadRes('link', "build/bundle.css", () => {
                    loadRes ("")
                }, (element) => {
				    console.log('Fail local Cdn, trying fallback')
					loadLocal();
                }
            )
		</script>
    </head>
    <body>
    
    </body>
</html>
