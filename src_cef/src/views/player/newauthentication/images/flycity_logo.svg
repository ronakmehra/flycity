<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 60" width="320" height="60">
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00C6FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0072FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00C6FF;stop-opacity:0.8" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Plane icon -->
  <g transform="translate(6,10)" filter="url(#glow)">
    <path d="M38,20 L20,26 L8,24 L6,28 L18,32 L14,40 L18,41 L24,34 L34,37 L36,34 L24,28 Z" 
          fill="url(#planeGrad)" opacity="0.9"/>
    <path d="M38,20 L36,16 L28,18 L32,22 Z" fill="white" opacity="0.7"/>
  </g>
  <!-- FLYCITY text -->
  <text x="52" y="36" 
        font-family="'Arial Black', 'Impact', sans-serif" 
        font-size="26" 
        font-weight="900"
        fill="url(#textGrad)"
        letter-spacing="2"
        filter="url(#glow)">FLYCITY</text>
  <!-- ROLEPLAY text -->
  <text x="54" y="52" 
        font-family="'Arial', sans-serif" 
        font-size="11" 
        font-weight="400"
        fill="rgba(255,255,255,0.65)"
        letter-spacing="5">ROLEPLAY</text>
  <!-- Divider line -->
  <line x1="52" y1="39" x2="235" y2="39" stroke="url(#textGrad)" stroke-width="1" opacity="0.4"/>
</svg>
